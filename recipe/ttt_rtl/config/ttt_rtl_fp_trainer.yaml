# TTT-RTL trainer config for FloatPoint problems (e.g. fp_add).
#
# Standalone config (inherits ppo_trainer directly, same as ttt_rtl_trainer)
# with adjustments for large multi-module RTL designs on 8×A800 80 GB:
#
#   - Longer context (16K prompt + 12K response) so the full previous Verilog
#     attempt fits in the prompt (Discover algorithm requirement).
#   - TP=2 rollout: model split across 2 GPUs → 8 GB weights/GPU instead of
#     16 GB → 32 GB KV cache per GPU pair. No OOM at 28K context on 80 GB.
#   - Longer EDA timeouts: fp_add is 4021 lines; Yosys+OpenSTA can take 60-90s.
#   - More training steps: fp_add is 50-130× harder than typical RTLLM problems.
#
# Usage (interactive):
#   CONFIG_NAME=ttt_rtl_fp_trainer EXP_NAME=fp_add_exp2 \
#     MODEL_PATH=checkpoints/ttt-rtl-sft/global_step_18/huggingface \
#     bash recipe/ttt_rtl/run_ttt_rtl.sh

hydra:
  searchpath:
    - file://verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

data:
  train_files: null
  val_files: null
  train_batch_size: 4
  val_batch_size: 8
  gen_batch_size: ${data.train_batch_size}
  dataloader_num_workers: 0
  shuffle: false
  validation_shuffle: false
  # Longer prompt to hold the full prior Verilog attempt without truncation.
  # (Discover algorithm requires the complete previous state in the prompt.)
  max_prompt_length: 16384
  # thinking (~4096 tok) + code generation (~8192 tok).
  max_response_length: 12288
  truncation: left
  ttt_data_source: ttt/rtl
  custom_cls:
    path: pkg://recipe.ttt_rtl.dataset
    name: TTTRTLDataset
  sampler:
    class_path: pkg://recipe.ttt_rtl.sampler
    class_name: TTTRTLSampler
  ttt_rtl:
    rtllm_dir: RTLLM
    problems: "fp_add"
    max_buffer_size: 500
    topk_children: 2
    puct_c: 1.0
    lineage_blocking: true
    seed: 42
    state_pool_dir: ${trainer.default_local_dir}/ttt_rtl_state_pool
    state_pool_history_every: ${trainer.save_freq}
    liberty_file: recipe/ttt_rtl/pdk/sky130_fd_sc_hd__tt_025C_1v80.lib
    opensta_binary: sta
    clk_period_ns: 10.0

custom_reward_function:
  path: recipe/ttt_rtl/rtl_reward.py
  name: compute_score
  reward_kwargs:
    # fp_add is 4021 lines; Yosys synthesis + OpenSTA timing can take 60-90 s.
    timeout_s: 120.0
    w_syntax: 0.1
    w_func: 1.0
    w_ppa: 10.0
    ppa_baseline: 0
    failure_reward: 0.0
    liberty_file: recipe/ttt_rtl/pdk/sky130_fd_sc_hd__tt_025C_1v80.lib
    opensta_binary: sta
    opensta_timeout_s: 60.0
    clk_period_ns: 10.0

reward_model:
  enable: false
  launch_reward_fn_async: false

algorithm:
  adv_estimator: ttt_entropic_adaptive
  use_kl_in_reward: false
  use_kl_in_advantage: true
  ttt_kl_penalty_coef: 0.1
  custom_adv_estimator_use_critic: false
  ttt_entropic_kl_budget: 0.6931471805599453
  ttt_entropic_beta_max: 1000000.0
  ttt_entropic_beta_iters: 60
  ttt_entropic_epsilon: 1e-12
  ttt_remove_constant_reward_groups: true
  ttt_constant_reward_tol: 1e-12

actor_rollout_ref:
  actor:
    use_kl_loss: false
    entropy_coeff: 0.0
    use_dynamic_bsz: true
    ppo_mini_batch_size: ${data.train_batch_size}
    # Dynamic-batching budget: covers max_prompt + max_response (16384+12288=28672),
    # rounded up to next power of two.
    ppo_max_token_len_per_gpu: 32768
    # Chunk the softmax in entropy_from_logits to avoid a single 20+ GB fp32
    # allocation (vocab_size=151936 × batch_tokens × 4 bytes). Without this,
    # compute_log_prob OOMs when vLLM model weights + FSDP states leave < 13 GB free.
    entropy_from_logits_with_chunking: true
    policy_loss:
      loss_mode: gpg
  rollout:
    n: 8
    temperature: 1.0
    top_p: 1.0
    # TP=2: model split across 2 GPUs → 8 GB/GPU weights instead of 16 GB
    # → 32 GB KV cache per GPU (vs 16 GB with TP=1).
    # 8 GPUs / TP=2 = 4 vLLM instances; each handles 1 parent × 8 rollouts = 8 sequences.
    # Peak KV cache: 8 seq × 28,672 tok × 72 KB/tok (Qwen3-8B, TP=2) = 16.5 GB << 32 GB.
    tensor_model_parallel_size: 2
    log_prob_max_token_len_per_gpu: ${actor_rollout_ref.actor.ppo_max_token_len_per_gpu}
    # Must be ≥ max_prompt_length for chunked prefill of long prompts.
    max_num_batched_tokens: 32768
    # 0.5 × 80 GB = 40 GB vLLM budget; after 8 GB model (TP=2) → 32 GB KV cache/GPU.
    gpu_memory_utilization: 0.5
    # Explicit context window = max_prompt_length + max_response_length, rounded up.
    max_model_len: 32768

trainer:
  project_name: verl-ttt-rtl
  experiment_name: fp_add
  logger: ["console", "swanlab"]
  rollout_data_dir: ${trainer.default_local_dir}/rollout_samples
  log_val_generations: 0
  val_before_train: false
  test_freq: -1
  save_freq: 50
  total_epochs: 100
  # fp_add needs more steps: 4021-line design, 1525 test vectors, 0% func success at step 23.
  total_training_steps: 500
  critic_warmup: 0
  nnodes: 1
  n_gpus_per_node: 8
